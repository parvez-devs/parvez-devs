<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#060910">
  <title>Live Preview</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="public-page">
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="dot"></span>LIVE PREVIEW</div>
      <span class="pill">● Trending now</span>
    </header>

    <section class="hero">
      <div class="eyebrow">FEATURED PREVIEWS</div>
      <h1>Discover what’s trending now.</h1>
      <p>Animated previews from featured partners. Tap anywhere to continue.</p>
    </section>

    <main id="streamGrid" class="grid"></main>

    <footer>
      <span>Featured sponsored previews</span>
      <span>External sponsored page opens when selected</span>
    </footer>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
